name: Server image

# Builds the server container, runs the tests, checks sign-in and roles through
# the Entra ID gateway, validates the deployment files and scans the image for
# known vulnerabilities.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pytest tests -q
      - name: Build image
        run: docker build -t vulnscan:test .
      - name: Sign-in, roles and hardening check
        run: tools/server_smoke.sh vulnscan:test
      - name: Validate deployment files
        working-directory: deploy
        run: |
          cp vulnscan.env.example vulnscan.env
          cp signin.env.example signin.env
          mkdir -p secrets && touch secrets/nvd_api_key
          docker compose config --quiet && echo "docker-compose.yml is valid"
      - name: Scan image for known vulnerabilities (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vulnscan:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: List of packages in the image
        run: docker run --rm --entrypoint cat vulnscan:test /app/installed-packages.txt
